<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student form </title>
</head>
<body>
    <center>
    <form>
        <fieldset>
    <h1>Student Form</h1>
    <label for="username">Name:</label>
    <input type="text" name="username" id="username" placeholder="Enter your Name"/>


    <br>
    <label for="password">Password:</label>
    <input type="password" name="password" placeholder="Enter your password" id="password"/>
    

    <br>
    <label for="number">Number</label>
    <input type="number" name="number" placeholder="Enter your number" id="number"/>

     <br>
    <label for="email">Email</label>
    <input type="email" name="email" placeholder="Enter your Email" id="email"/>


     <br>
    <label for="date">Date of birth</label>
    <input type="date" name="date"id="date"/>


     <br>
    <label for="month">Month</label>
    <input type="month" name="month" id="month"/>


     <br>
    <label for="dataTime">Date & Time</label>
    <input type="datetime-local" name="dateTime" id="dateTime"/>


     <br>
    <label for="color">Color</label>
    <input type="color" name="color" id="color"/>


     <br>
    <label for="document">Uplod your document</label>
    <input type="file" name="document" id="document"/>

    <br>
    <label><input type="radio" name="gender" value="male">Male</label>
    <label><input type="radio" name="gender" value="female">Female</label>
    <label><input type="radio" name="gender" value="other">other</label>

    
    <br>
    <p>Select hobbies</p>
    <label><input type="checkbox" name="hobby" value="reading">Reading</label>
    <label><input type="checkbox" name="hobby" value="reading">Playing</label>
    <label><input type="checkbox" name="hobby" value="reading">Coding</label>

    <P>Highest Qualification</P>
    <select name="Qualification" id="qualification">
        <option value="10">10th</option>
        <option value="12">12th</option>
        <option value="graduation">Graduation</option>
    
    </select>


    <br>
    <label for="resume">Uplod Resume</label>
    <input type="file" name="resume" id="resume" required="true"/>

    <br>
    <button type="submit">Submit</button>
    <button type="reset">Clear Form</button>
    <button type="button">Click me</button>
</fieldset>
    </form>
    </center>
</body>
</html>
