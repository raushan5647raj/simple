<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html form</title>
</head>
<body>
    <table border="1" cellspacing="0">
         
    <th colspan="2"><h1>Student Registration Form</h1></th>
        <tr>
            <td><table>Name:</table></td>
            <td><input type="text" name="username" placeholder="Enter your name"></td>

        </tr>
        
        <tr>
            <td><label>Email:</label></td>
            <td><input type="email" name="email" placeholder="Enter your Email"></td>
        </tr>

        <tr>
            <td><label>Mobile No:</label></td>
            <td><input type="tel" name="Mobile" placeholder="Enter your Mobile No:"></td>
        </tr>

        <tr>
            <td><label>Password:</label></td>
            <td><input type="password" name="Password" placeholder="Enter your password" required="true"></td>


        </tr>

        <tr>
            <td><label>Gender</label></td>
    <td><label><input type="radio" name="ml"> Male <input type="radio" name="ml"> Female</label></td>

        </tr>

        <tr>
            <td> <label>Date of Birth:</label></td>
            <td> <input type="date" name="dob"></td>
        </tr>

        <tr>
            <td> <label> Qualification:</label></td>
            <td>
             <input type="checkbox" name="qualification"> 10th 
            <input type="checkbox" name="qualification"> 12th 
             <input type="checkbox" name="qualification"> Graduation
             </td>
        </tr>

        <tr>
            <td><label>Adderess:</label></td>
            <td> <textarea></textarea></td>
        </tr>

        <tr>
            <td><label>City</label></td>

            <td> <select>
                 <option>Patna</option>
                 <option>Bhagalpur</option>
                 <option>Shaikhpura</option>
                 <option>Samastiput</option>
                 <option>Chapra</option>
                 <option>Arrah</option>
                 <option>Lakhisarai</option>
            </select>

            </td>
        </tr>

        <tr>
            <td><table>Uplod photo</table></td>
            <td><input type="file" name="file"></td>
        </tr>

        <tr>
            <td><button type="Reset">Reset</button></td>
            <td><button type="submit">Register now</button></td>
        </tr>
    </table>
</body>
</html>
